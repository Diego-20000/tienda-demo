<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — Panel Dulce Cosecha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="demo-banner">
  🔧 <strong>Demo de prototipo</strong> — lo que cargues acá se guarda solo en este navegador.
  <button data-reset-demo>Reiniciar demo</button>
</div>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><span class="logo-mark">DC</span> Dulce Cosecha</div>
    <nav>
      <a href="pedidos.html" data-admin-nav="pedidos">📥 Pedidos por confirmar</a>
      <a href="productos.html" data-admin-nav="productos">🍯 Productos</a>
      <a href="historial.html" data-admin-nav="historial">📋 Historial</a>
      <a href="../index.html">🛍️ Ver tienda</a>
      <a href="#" data-admin-logout>🚪 Salir</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 style="margin-bottom:2px;">Productos</h1>
        <p class="text-muted" style="margin:0;">Agregá, editá o borrá productos y categorías. Se refleja al toque en la tienda.</p>
      </div>
      <button class="btn btn-primary" id="add-product-btn">+ Agregar producto</button>
    </div>

    <div class="card" style="padding:18px 20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
        <h3 style="margin:0; font-size:15px;">Categorías</h3>
        <button class="btn btn-ghost btn-sm" id="restore-catalog-btn">↺ Restaurar catálogo original</button>
      </div>
      <div id="category-chips"></div>
      <form id="add-category-form" class="add-category-form" style="margin-top:6px;">
        <input type="text" id="new-category-input" placeholder="Nueva categoría (ej: Escabeches)">
        <button type="submit" class="btn btn-secondary btn-sm">+ Agregar</button>
      </form>
    </div>

    <div class="toolbar" style="margin-top:24px;">
      <div class="search-box">
        🔍 <input type="text" id="search-input" placeholder="Buscar productos...">
      </div>
      <div class="category-filters" id="category-filters">
        <button class="active" data-cat="all">Todos</button>
      </div>
    </div>

    <div id="products-list"></div>
  </main>
</div>

<script src="../assets/js/placeholders.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin.js"></script>
<script src="../assets/js/admin-productos.js"></script>
</body>
</html>
