<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Panel Abriendo Caminos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="demo-banner">
  🔧 <strong>Demo de prototipo</strong> — login simulado, sin autenticación real.
  <button data-reset-demo>Reiniciar demo</button>
</div>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="brand" style="justify-content:center; margin-bottom:18px;"><span class="logo-mark">AC</span> Abriendo Caminos</div>
    <h2 style="margin-bottom:4px;">Panel de administración</h2>
    <p class="text-muted" style="font-size:13.5px; margin-bottom:22px;">Acceso para Priscila — confirmar pagos y ver pedidos.</p>
    <form id="login-form">
      <div class="field" style="text-align:left;">
        <label for="user">Usuario</label>
        <input type="text" id="user" value="priscila" required>
      </div>
      <div class="field" style="text-align:left;">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" placeholder="cualquier valor sirve en la demo" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
    <p class="hint" style="margin-top:16px;">🔧 Es una demo: cualquier usuario/contraseña entra. En la versión real va a tener login protegido de verdad.</p>
    <p style="margin-top:10px;"><a href="../index.html">← Volver a la tienda</a></p>
  </div>
</div>

<script src="../assets/js/placeholders.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  adminLogin();
  window.location.href = 'pedidos.html';
});
</script>
</body>
</html>
